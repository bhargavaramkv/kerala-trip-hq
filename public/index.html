<style>
/* Layout: one phone-width column of content on a leaf-tinted ground, fixed bottom tab bar, bottom sheets for every action; desktop centres the column. */
:root{
  --bg:#EDF2EA; --surface:#FBFDF9; --surface-2:#E2EBDD; --ink:#13241B; --ink-2:#4B5E53; --ink-3:#6E8275; --line:#D9E3D4;

  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --map-sea:#CFE3E6; --map-land:#E9F0DF; --map-hill:#CFE0C3; --map-ink:#3B5246;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px; --nav-h:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1510; --surface:#13201A; --surface-2:#1B2C22; --ink:#E6EFE8; --ink-2:#A8BAAE; --ink-3:#83978A; --line:#27382E;
  --brand:#84CF9F; --brand-ink:#0B1510; --leaf:#86CF97; --laterite:#E8906A; --turmeric:#EDB74B; --sea:#79C6D5;
  --ok:#86D7A2; --ok-bg:#173525; --warn:#EDC266; --warn-bg:#382D11; --bad:#F2A097; --bad-bg:#3C1D1A; --info:#84CCDA; --info-bg:#11303A; --ai:#BDB2F5; --ai-bg:#262140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --map-sea:#10303A; --map-land:#1A2A20; --map-hill:#21382A; --map-ink:#B9CDBF; --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1510; --surface:#13201A; --surface-2:#1B2C22; --ink:#E6EFE8; --ink-2:#A8BAAE; --ink-3:#83978A; --line:#27382E;
  --brand:#84CF9F; --brand-ink:#0B1510; --leaf:#86CF97; --laterite:#E8906A; --turmeric:#EDB74B; --sea:#79C6D5;
  --ok:#86D7A2; --ok-bg:#173525; --warn:#EDC266; --warn-bg:#382D11; --bad:#F2A097; --bad-bg:#3C1D1A; --info:#84CCDA; --info-bg:#11303A; --ai:#BDB2F5; --ai-bg:#262140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --map-sea:#10303A; --map-land:#1A2A20; --map-hill:#21382A; --map-ink:#B9CDBF; --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
.btn,.chip,.act,.navbtn,.seg button,.quick button{-webkit-user-select:none;user-select:none}
a{color:var(--sea)}

.app{max-width:560px;margin:0 auto;min-height:100%;min-height:100dvh;overflow-x:clip;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}

.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.page-head{padding-top:18px;padding-bottom:6px}
.page-head h1{font-size:32px;font-weight:800}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px}
.section-title h2{font-size:18px;font-weight:700}
.link-btn{background:none;border:0;padding:6px 0;color:var(--sea);font-weight:600;cursor:pointer;min-height:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-sm)}
.card.tight{padding:12px}
.card.press{cursor:pointer}
.btn,.chip,.act,.icon-btn,.seg button,.quick button,.link-btn{transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:active:not(:disabled),.chip:active:not(:disabled),.act:active:not(:disabled),.icon-btn:active:not(:disabled),.seg button:active:not(:disabled),.quick button:active:not(:disabled),.link-btn:active:not(:disabled){transform:scale(.97)}
.card.press,.dcard,.dbig,.day-head,.item{transition:transform 160ms var(--ease-out),box-shadow 200ms ease}
.card.press:active,.dcard:active,.dbig:active{transform:scale(.985)}
.day-head:active,.item:active{transform:scale(.99)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ai{background:var(--ai);color:var(--surface);border-color:var(--ai)}
.btn.danger{color:var(--bad);border-color:var(--bad)}

.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}

.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg,.btn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.ai{background:var(--ai-bg);color:var(--ai)} .pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.listed{background:var(--info-bg);color:var(--info)} .tag.est{background:var(--warn-bg);color:var(--warn)} .tag.verified{background:var(--ok-bg);color:var(--ok)} .tag.gk{background:var(--ai-bg);color:var(--ai)}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:10px;min-height:38px;padding:0 12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}

.seg-hl[data-instant]{transition:none}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{scroll-snap-align:start;flex:none}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;font-weight:700;font-size:13px;color:#fff;border:2px solid var(--surface)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:52px;height:52px;font-size:20px}
.av.sm{width:24px;height:24px;font-size:11px;border-width:1.5px}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.bar>span{height:100%;display:block}
.scene{position:relative;overflow:hidden;background:var(--surface-2)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:46px;font-size:16px}
textarea.field{min-height:92px;resize:vertical}
label.lbl{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--info-bg);color:var(--info)} .banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.ai{background:var(--ai-bg);color:var(--ai)}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.list>.li:first-child{border-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
/* hero */
.hero{position:relative;height:320px;border-radius:0 0 28px 28px;overflow:hidden;color:#fff}
.hero .scene{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,24,16,0) 30%,rgba(8,24,16,.78) 100%)}

.hero h1{font-size:44px;font-weight:800;letter-spacing:-.03em}
.hero .tagline{font-size:16px;opacity:.92;margin-top:4px}
.count{display:flex;gap:8px;margin-top:12px}
.count div{background:rgba(255,255,255,.14);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:8px 12px;min-width:68px;text-align:center}
.count b{font-family:var(--f-display);font-size:22px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.quick{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:18px;min-height:84px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;padding:6px}
.quick svg{width:36px;height:36px;padding:8px;border-radius:50%;background:var(--ok-bg);color:var(--brand);box-sizing:border-box}
/* destination cards */
.dcard{width:min(78vw,300px);border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;box-shadow:var(--shadow-sm)}
.dcard .scene{height:150px}
.dcard .body{padding:12px 14px}

.dbig .body{padding:14px}
.dbig h3{font-size:24px;font-weight:800}
.plan-badge{position:absolute;top:12px;left:12px;background:rgba(10,30,20,.62);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
/* itinerary */
.day{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-sm)}
.day-head{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.datebox{width:54px;flex:none;border-radius:14px;background:var(--brand);color:var(--brand-ink);text-align:center;padding:6px 0}

.datebox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.costline{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink-2)}
/* posts */
.post{display:flex;flex-direction:column;gap:8px}
.post h3{font-size:17px;font-weight:700;font-family:var(--f-body);letter-spacing:0}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:36px;padding:0 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:14px;font-weight:600}
.act.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.act.onbad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.act svg{width:16px;height:16px}
.comment{display:flex;gap:10px}
.comment .bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px;min-width:0;flex:1}
.replies{margin-left:42px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;height:46px}
/* AI */
.ai-box{border:1px solid var(--ai);border-radius:16px;padding:14px;background:var(--ai-bg);display:flex;flex-direction:column;gap:10px}
.ai-box h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ai)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{background:var(--surface);border-radius:12px;padding:10px;font-size:14px;min-width:0}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .6s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.navbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.navbtn svg{width:24px;height:24px}
@supports not (backdrop-filter:blur(1px)){.nav{background:var(--surface)}}
.navbtn .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:99px;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.navbtn:active .ic{transform:scale(.92)}
.navbtn.on{color:var(--brand)}
.navbtn.on .ic{background:var(--surface-2)}
.navbtn .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--laterite);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums;font-weight:700;box-shadow:0 0 0 2px var(--surface)}
/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(6,16,10,.48);display:flex;align-items:flex-end;justify-content:center;animation:fade 200ms var(--ease-out)}
.sheet{width:100%;max-width:560px;max-height:92%;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:sheet-in 420ms var(--ease-drawer);will-change:transform;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bg.closing{animation:fade-out 180ms ease-out forwards}
.sheet-bg.closing .sheet{animation:sheet-out 200ms var(--ease-out) forwards!important}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-left,0px)) 6px;position:relative;touch-action:none;cursor:grab}
.sheet-head h2{font-size:20px;font-weight:800;flex:1;min-width:0}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:9px;background:var(--line)}
.grab::before{content:"";position:absolute;inset:-8px -20px}
.sheet-body{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes sheet-out{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
.view{animation:view-in 180ms var(--ease-out)}
@keyframes view-in{from{opacity:0;transform:translateY(4px)}}
.stagger>*{animation:rise 360ms var(--ease-out) backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.stagger>:nth-child(2){animation-delay:40ms}.stagger>:nth-child(3){animation-delay:80ms}.stagger>:nth-child(4){animation-delay:120ms}.stagger>:nth-child(5){animation-delay:160ms}.stagger>:nth-child(6){animation-delay:200ms}.stagger>:nth-child(7){animation-delay:240ms}.stagger>:nth-child(8){animation-delay:280ms}.stagger>:nth-child(9){animation-delay:320ms}.stagger>:nth-child(n+10){animation-delay:360ms}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.12),0 0 0 1px rgba(255,255,255,.06) inset;max-width:520px;transition:opacity 400ms ease,transform 400ms ease}
@starting-style{.toast{opacity:0;transform:translateY(100%)}}
.toast.leaving{opacity:0;transform:translateY(8px) scale(.97);transition-duration:200ms}
.boot{padding:40px 20px;text-align:center;color:var(--ink-2)}
.feed .li .av{margin-top:2px}
.donut-wrap{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.legend{display:flex;flex-direction:column;gap:7px;font-size:14px}
.legend div{display:flex;gap:8px;align-items:center}
.legend .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.table-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.map svg{width:100%;height:auto;display:block}
.route{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
@media (hover:hover) and (pointer:fine){
  .btn:not(.primary):not(.ai):hover,.chip:not(.on):hover,.act:not(.on):not(.onbad):hover,.quick button:hover{background:var(--surface-2)}
  .btn.primary:hover,.btn.ai:hover{filter:brightness(1.08)}
  .icon-btn:hover{background:var(--surface-2)}
  .link-btn:hover{text-decoration:underline;text-underline-offset:3px}
  .navbtn:not(.on):hover .ic{background:var(--surface-2)}
  .card.press:hover,.dcard:hover,.dbig:hover{box-shadow:var(--shadow)}
}
@media (prefers-reduced-motion: reduce){
  .sheet{animation-name:fade} .sheet-bg.closing .sheet{animation-name:fade-out!important} .view,.stagger>*{animation-name:fade} .route{animation:none} .toast{transform:none!important} @starting-style{.toast{transform:none}}
  .btn:active,.chip:active,.act:active,.icon-btn:active,.seg button:active,.quick button:active,.card.press:active,.dcard:active,.dbig:active,.day-head:active,.item:active,.navbtn:active .ic{transform:none}
  .seg-hl{transition-duration:0ms}
}
@media (min-width:600px){.hero{height:360px;border-radius:0 0 28px 28px;margin-top:0}}

const inr = n => (n<0?"−":"") + "₹" + Math.abs(Math.round(n||0)).toLocaleString("en-IN");
const signed = n => (n>0?"+":"") + inr(n);
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o||null));
const clip = (s,n) => { s = String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; };
function ago(ts){ if(!ts) return ""; const s=(Date.now()-ts)/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; if(s<604800) return Math.floor(s/86400)+"d ago"; return new Date(ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
const basisTag = b => b==="listed" ? html`<span class="tag listed">Listed</span>` : b==="est" ? html`<span class="tag est">Est.</span>` : b==="verified" ? html`<span class="tag verified">Verified</span>` : b==="gk" ? html`<span class="tag gk">AI knowledge</span>` : null;
const srcLink = s => s ? html`<a href=${s.u} target="_blank" rel="noopener">${s.t}</a>` : null;
function hashColor(str){ let x=0; for(const c of String(str)) x=(x*31+c.charCodeAt(0))|0; const hues=[150,20,195,40,265,340,95]; return `hsl(${hues[Math.abs(x)%hues.length]} 45% 38%)`; }

const S = {mode:"loading", me:null, isOwner:false, canWrite:null, people:{}, roster:{}, reviews:{}, decisions:{}, itin:{}, bookings:{}, meta:{}, requests:{}, profiles:{}, loaded:{}, running:{}, sheet:null, toasts:[], sampleOK:false};
const listeners = new Set();
function set(p){ Object.assign(S,p); listeners.forEach(f=>f()); }
function useStore(){ const [,f]=useState(0); const r=useRef(null); if(!r.current){ r.current=()=>f(x=>x+1); listeners.add(r.current); } useEffect(()=>()=>listeners.delete(r.current),[]); return S; }
let API = {db:null,user:null,sample:null};
function toast(msg){ const id=rid(); set({toasts:[...S.toasts,{id,msg}]}); setTimeout(()=>set({toasts:S.toasts.map(t=>t.id===id?Object.assign({},t,{leaving:true}):t)}),2800); setTimeout(()=>set({toasts:S.toasts.filter(t=>t.id!==id)}),3000); }
const openSheet = (type, props) => set({sheet:{type, props:props||{}}, sheetClosing:false});
const closeSheet = () => { if(!S.sheet||S.sheetClosing) return; set({sheetClosing:true}); setTimeout(()=>{ if(S.sheetClosing) set({sheet:null, sheetClosing:false}); },200); };
function dbErr(e){ const c=e&&e.code; if(c==="invalid_argument") return "You don't have permission to change that."; if(c==="quota_exceeded") return "The trip database is full."; if(c==="resource_exhausted") return "Too many changes at once. Try again in a moment."; return "Couldn't save. Check your connection and try again."; }

async function boot(){
  if(!window.claude || !window.claude.use){ set({mode:"offline"}); return; }
  const [db,user,sample] = await Promise.all(["db","user","sample"].map(n=>window.claude.use(n).catch(()=>null)));
  API = {db,user,sample};
  if(!db || !user){ set({mode:"offline"}); return; }
  const me = await user.me();
  if(!me.id){ set({mode:"signin"}); return; }
  const canWrite = await user.can("data.write");
  set({me:me.id, isOwner:!!me.isOwner, canWrite, mode:"live", sampleOK:!!sample});
  const sub = (col,key) => db.collection(col).onSnapshot(snap => {
    const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({_id:d.id}, d.data()); });
    set({[key]:o, loaded:Object.assign({},S.loaded,{[key]:true})});
    if(key==="people") refreshProfiles();
    if(key==="roster") ensureOwnerRoster();
  }, e => { if(e.code==="revoked") set({mode:"revoked"}); else toast("Live updates paused ("+e.code+"). Reload to reconnect."); });
  sub("people","people"); sub("roster","roster"); sub("reviews","reviews"); sub("decisions","decisions");
  sub("itinerary","itin"); sub("bookings","bookings"); sub("meta","meta");
}
let profKey="";
async function refreshProfiles(){
  const ids = Object.keys(S.people); if(S.me && !ids.includes(S.me)) ids.push(S.me);
  const k = ids.sort().join(","); if(!ids.length || k===profKey) return; profKey=k;
  try{ const p = await API.user.profiles(ids); set({profiles:p}); }catch(e){}
}
async function ensureOwnerRoster(){
  if(!S.isOwner || !S.me || (S.roster[S.me] && S.roster[S.me].role==="owner")) return;
  try{ await API.db.doc("roster/"+S.me).set({role:"owner",status:"active",at:Date.now()}); }catch(e){}
}

/* --- my own document: everything a person contributes lives in people/<their id> --- */
let wq = Promise.resolve();
function mutateMe(fn){
  if(!canContribute()){ toast("You can view but not contribute here."); return Promise.resolve(false); }
  wq = wq.then(async ()=>{
    const cur = clone(S.people[S.me]) || {}; delete cur._id;
    cur.posts=cur.posts||[]; cur.expenses=cur.expenses||[]; cur.votes=cur.votes||{}; cur.reacts=cur.reacts||{}; cur.polls=cur.polls||{};
    fn(cur); cur.updatedAt=Date.now();
    await API.db.doc("people/"+S.me).set(cur); return true;
  }).catch(e=>{ toast(dbErr(e)); return false; });
  return wq;
}
const canContribute = () => S.mode==="live" && S.canWrite!==false && !!S.people[S.me] && !isRemoved(S.me);
const isRemoved = id => S.roster[id] && S.roster[id].status==="removed";

/* --- derived data --- */
function members(){
  return Object.values(S.people).filter(p=>!isRemoved(p._id)).sort((a,b)=>(roleOf(b._id)==="owner")-(roleOf(a._id)==="owner") || (a.joinedAt||0)-(b.joinedAt||0));
}
const roleOf = id => (S.roster[id] && S.roster[id].role) || (id===S.me && S.isOwner ? "owner" : "member");
function nameOf(id){ if(id==="ai") return "AI planner"; if(String(id).startsWith("name:")) return id.slice(5); const p=S.people[id]; const pr=S.profiles[id]; return (p&&p.nick) || (pr&&pr.name) || "Traveller"; }
function allPosts(){ const out=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; (p.posts||[]).forEach(x=>out.push(Object.assign({by:p._id},x))); }); return out; }
const CREW_NAMES=["Bhargava","Sahith","Manoj"];
function resolvePayer(pid, logger){ if(!pid) return logger; if(S.people[pid]) return pid; if(String(pid).startsWith("name:")){ const n=pid.slice(5).toLowerCase(); const m=Object.values(S.people).find(q=>!isRemoved(q._id)&&String(q.nick||"").toLowerCase()===n); return m?m._id:pid; } return logger; }
function payerOptions(){ const mem=members(); const ids=mem.map(m=>m._id); CREW_NAMES.forEach(n=>{ if(!mem.some(m=>String(m.nick||"").toLowerCase()===n.toLowerCase())) ids.push("name:"+n); }); return ids; }
function allExpenses(){ const out=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; (p.expenses||[]).forEach(x=>out.push(Object.assign({},x,{by:p._id, payer:resolvePayer(x.paidBy,p._id)}))); }); return out.sort((a,b)=>b.at-a.at); }
function votesFor(target){ const up=[],down=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const v=p.votes&&p.votes[target]; if(v&&v.v===1) up.push(p._id); if(v&&v.v===-1) down.push(p._id); }); return {up,down}; }
function reactsFor(target){ const m={}; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const r=p.reacts&&p.reacts[target]; if(r&&r.e){ (m[r.e]=m[r.e]||[]).push(p._id);} }); return m; }
function pollWinner(pid){ const m=pollVotes("poll-"+pid); const a=Object.entries(m).map(([k,v])=>[k,v.length]).sort((x,y)=>y[1]-x[1]); return a.length&&a[0][1]>0&&(a.length<2||a[0][1]>a[1][1])?a[0][0]:null; }
function pollVotes(pid){ const m={}; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const v=p.polls&&p.polls[pid]; if(v&&v.o){ (m[v.o]=m[v.o]||[]).push(p._id);} }); return m; }
const commentsOn = target => allPosts().filter(p=>p.kind==="comment" && p.target===target);

function versions(){ return Object.values(S.itin).filter(v=>v.days).sort((a,b)=>b.n-a.n); }
function baseVersion(){ return {_id:"base", n:0, plan:"A", days:PLAN_AB, status:"draft", why:"Research baseline: Plan A budget version (not saved yet)", adjust:{}, unsaved:true}; }
function currentVersion(){ const m=S.meta.state; if(m && m.current && S.itin[m.current]) return S.itin[m.current]; const v=versions(); return v[0] || baseVersion(); }
function projection(v){
  const cat={}; BUDGET_CATS.forEach(c=>cat[c.id]=0);
  (v.days||[]).forEach(d=>BUDGET_CATS.forEach(c=>cat[c.id]+=(d.cost&&d.cost[c.id])||0));
  Object.entries(v.adjust||{}).forEach(([k,x])=>{ if(k in cat) cat[k]+=Number(x)||0; });
  const sub=Object.values(cat).reduce((a,b)=>a+b,0); const cont=Math.round(sub*CONTINGENCY);
  return {cat, sub, cont, total:sub+cont};
}
function flatItems(days){ const m={}; (days||[]).forEach((d,di)=>SLOTS.forEach(([sl])=>((d.slots&&d.slots[sl])||[]).forEach(it=>{ m[it.id]=Object.assign({day:di+1, slot:sl, date:d.dow+" "+d.dd+" Dec"},it); }))); return m; }
function findItem(id){ const v=currentVersion(); const m=flatItems(v.days); if(m[id]) return m[id]; for(const x of versions()){ const mm=flatItems(x.days); if(mm[id]) return mm[id]; } const b=flatItems(PLAN_A); if(b[id]) return b[id]; return flatItems(PLAN_B)[id]||null; }
function labelFor(target){
  if(!target) return "the trip";
  const d=DEST.find(x=>x.id===target); if(d) return d.name;
  if(target.startsWith("poll-")){ const p=POLLS.find(x=>"poll-"+x.id===target); return p?p.q:"a decision"; }
  if(target==="plan-compare") return "Plan A vs Plan B";
  if(target.startsWith("prop-")){ const p=allPosts().find(x=>x.id===target.slice(5)); return p?"the proposal for “"+clip(p.title,40)+"”":"a proposal"; }
  if(target.startsWith("bk-")){ const b=S.bookings[target.slice(3)]; return b?b.title:"a booking"; }
  const it=findItem(target); if(it) return "“"+clip(it.text,46)+"”";
  const p=allPosts().find(x=>x.id===target); if(p) return "“"+clip(p.title||p.body,46)+"”";
  return "the trip";
}
function statusOf(post){
  const d=S.decisions["post-"+post.id]; if(d) return d.status;
  const r=S.reviews[post.id];
  if(S.running[post.id]) return "reviewing";
  if(r){ if(r.state==="running" && Date.now()-r.at<6*60000) return "reviewing"; if(r.state==="done") return "ai"; }
  return "new";
}
function statusPill(post){
  const s=statusOf(post);
  if(s==="new") return html`<span class="pill neutral">New</span>`;
  if(s==="reviewing") return html`<span class="pill ai"><span class="spinner" style="width:10px;height:10px;border-width:2px"></span>Under AI review</span>`;
  if(s==="ai"){ const v=S.reviews[post.id].result&&S.reviews[post.id].result.verdict; return v==="not_recommended" ? html`<span class="pill bad">AI: not recommended</span>` : v==="needs_info" ? html`<span class="pill warn">AI: needs info</span>` : html`<span class="pill ai">AI recommended</span>`; }
  if(s==="approved") return html`<span class="pill ok">Approved</span>`;
  if(s==="rejected") return html`<span class="pill bad">Rejected</span>`;
  if(s==="incorporated") return html`<span class="pill ok">In the itinerary</span>`;
  return null;
}
function pendingDecisions(){
  const out=[];
  POLLS.forEach(p=>{ const voted=Object.values(pollVotes("poll-"+p.id)).reduce((n,x)=>n+x.length,0); if(!pollWinner(p.id)||voted<Math.max(2,members().length)) out.push({kind:"poll", poll:p}); });
  allPosts().filter(p=>p.kind==="suggestion" && statusOf(p)==="ai").forEach(p=>out.push({kind:"post", post:p}));
  return out;
}
const awaitingReview = () => allPosts().filter(p=>p.kind==="suggestion" && statusOf(p)==="new");

function addPost(p){ return mutateMe(d=>{ d.posts.push(Object.assign({id:rid(), at:Date.now()}, p)); }); }
function vote(target, v){ return mutateMe(d=>{ const cur=d.votes[target]; if(cur && cur.v===v) delete d.votes[target]; else d.votes[target]={v, at:Date.now()}; }); }
function react(target, e){ return mutateMe(d=>{ const cur=d.reacts[target]; if(cur && cur.e===e) delete d.reacts[target]; else d.reacts[target]={e, at:Date.now()}; }); }
function pollVote(pid, o){ return mutateMe(d=>{ d.polls[pid]={o, at:Date.now()}; }); }

async function ownerWrite(path, data){ try{ await API.db.doc(path).set(data); return true; }catch(e){ toast(dbErr(e)); return false; } }
async function createVersion(days, why, extra){
  const vs=versions(); const n=(vs[0]?vs[0].n:0)+1; const cur=currentVersion();
  const doc=Object.assign({n, at:Date.now(), by:S.me, why, status:"approved", plan:cur.plan||"A", days:clone(days), adjust:clone(cur.adjust)||{}, adjustNotes:clone(cur.adjustNotes)||[], basedOn:cur._id}, extra||{});
  if(!await ownerWrite("itinerary/v"+n, doc)) return null;
  await ownerWrite("meta/state", Object.assign({}, stripId(S.meta.state), {current:"v"+n, at:Date.now()}));
  return "v"+n;
}
const stripId = o => { const c=clone(o)||{}; delete c._id; return c; };
function applyChanges(days, changes){
  const nd=clone(days);
  (changes||[]).forEach(c=>{
    const day=nd[(c.day|0)-1]; if(!day) return;
    if(c.op==="add"){ const sl=SLOTS.some(s=>s[0]===c.slot)?c.slot:"optional"; (day.slots[sl]=day.slots[sl]||[]).push({id:"x"+rid(), t:c.time||"", text:c.text, src:"proposal"}); }
    else { SLOTS.forEach(([sl])=>{ const arr=day.slots[sl]||[]; const i=arr.findIndex(x=>x.id===c.itemId); if(i<0) return; if(c.op==="remove") arr.splice(i,1); else if(c.op==="replace") arr[i]=Object.assign({},arr[i],{text:c.text, t:c.time||arr[i].t, src:"proposal"}); }); }
    if(c.dayCost){ BUDGET_CATS.forEach(k=>{ if(typeof c.dayCost[k.id]==="number") day.cost[k.id]=Math.max(0,(day.cost[k.id]||0)+c.dayCost[k.id]); }); }
  });
  return nd;
}

function reviewPrompt(post){

- Challenge impractical ideas. Do not accept everything. If it doesn't fit, say so and offer the closest workable alternative.
- If it fits only by dropping something, name exactly what to drop (by item id).
- If it conflicts with another traveller's suggestion, propose a compromise.
- You cannot browse the web. Mark every fact as basis "trip data" (from the data below), "general knowledge" (your own knowledge; may be outdated) or "estimate". Never claim live prices, availability or confirmed timings. List what must be verified before booking.
- Be concrete: real place names, times, distances, rupee amounts. No generic advice.

TRIP DATA (JSON):
${JSON.stringify(tripContext())}

${JSON.stringify({author:nameOf(post.by), category:(CATS.find(c=>c.id===post.cat)||{}).label, title:post.title, details:post.body, estimatedCostByAuthor:post.cost||null, attachedTo:target})}

GROUP COMMENTS ON IT: ${JSON.stringify(comments)}
OTHER OPEN SUGGESTIONS: ${JSON.stringify(others)}

Reply with ONLY a JSON object of this shape:
{"summary":"one sentence verdict for a phone screen",
 "verdict":"recommend" | "recommend_with_changes" | "not_recommended" | "needs_info",
 "fit":"2-3 sentences on how it fits the 5-day plan",
 "facts":[{"text":"...","basis":"trip data"|"general knowledge"|"estimate"}],
 "travel":{"extraKm":number|null,"extraHours":number|null,"note":"..."},
 "costDelta":{"transport":0,"stays":0,"food":0,"activities":0,"misc":0},
 "conflicts":["..."],
 "alternatives":["..."],
 "pros":["..."], "cons":["..."],

 "proposal": null | {"title":"short name of the change","current":"what the plan says now","proposed":"what it would say","changes":[{"day":1-5,"op":"add"|"replace"|"remove","slot":"morning"|"afternoon"|"evening"|"optional","itemId":"existing item id for replace/remove","time":"HH:MM or empty","text":"new item text for add/replace"}]},

const arr = (x,n) => Array.isArray(x) ? x.filter(s=>typeof s==="string"&&s.trim()).slice(0,n).map(s=>clip(s,400)) : [];
function sanitizeReview(r){
  r = r||{}; const cd={}; BUDGET_CATS.forEach(c=>{ const v=Number(r.costDelta&&r.costDelta[c.id]); cd[c.id]=isFinite(v)?Math.round(v):0; });
  let prop=null;
  if(r.proposal && typeof r.proposal==="object"){
    const ids=flatItems(currentVersion().days);
    const ch=(Array.isArray(r.proposal.changes)?r.proposal.changes:[]).slice(0,8).map(c=>({day:Math.max(1,Math.min(5,c.day|0)), op:["add","replace","remove"].includes(c.op)?c.op:"add", slot:SLOTS.some(s=>s[0]===c.slot)?c.slot:"optional", itemId:typeof c.itemId==="string"?c.itemId:"", time:typeof c.time==="string"?clip(c.time,5):"", text:clip(c.text||"",200)})).filter(c=>c.op==="add" ? c.text : ids[c.itemId] && (c.op==="remove"||c.text));
    prop={title:clip(r.proposal.title||"Proposed change",90), current:clip(r.proposal.current||"",400), proposed:clip(r.proposal.proposed||"",400), changes:ch};
  }
  const t=r.travel||{};
  return {summary:clip(r.summary||"",240), verdict:["recommend","recommend_with_changes","not_recommended","needs_info"].includes(r.verdict)?r.verdict:"needs_info",
    fit:clip(r.fit||"",700), facts:(Array.isArray(r.facts)?r.facts:[]).slice(0,8).map(f=>({text:clip(f&&f.text||"",300), basis:["trip data","general knowledge","estimate"].includes(f&&f.basis)?f.basis:"estimate"})).filter(f=>f.text),
    travel:{extraKm:isFinite(Number(t.extraKm))&&t.extraKm!==null?Number(t.extraKm):null, extraHours:isFinite(Number(t.extraHours))&&t.extraHours!==null?Number(t.extraHours):null, note:clip(t.note||"",300)},
    costDelta:cd, conflicts:arr(r.conflicts,5), alternatives:arr(r.alternatives,5), pros:arr(r.pros,5), cons:arr(r.cons,5), reasoning:clip(r.reasoning||"",900), proposal:prop, checkBeforeBooking:arr(r.checkBeforeBooking,6)};
}
function sampleMsg(e){ const c=e&&e.code; if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled") return "Claude isn't allowed on this page for you. Use the manual review instead."; if(c==="rate_limited") return "Claude is busy or your usage limit is reached. Try again later."; if(c==="invalid_json") return "Claude's answer wasn't readable. Try again."; if(c==="cancelled") return "Review stopped."; if(c==="session_expired") return "Sign in to claude.ai again, then retry."; return "The AI review failed. Try again in a moment."; }
async function runReview(post){
  if(!API.sample){ toast("AI isn't available in this view."); return false; }
  set({running:Object.assign({},S.running,{[post.id]:true})});
  const ref=API.db.doc("reviews/"+post.id);
  try{
    await ref.set({state:"running", by:S.me, at:Date.now(), source:"ai"});
    const raw = await API.sample.json(reviewPrompt(post), {modelTier:"default"});
    const result = sanitizeReview(raw);
    await ref.set({state:"done", by:S.me, at:Date.now(), source:"ai", result, itineraryVersion:currentVersion()._id});
    toast("AI review saved for everyone");
    return true;
  }catch(e){
    try{ await ref.set({state:"failed", by:S.me, at:Date.now(), source:"ai", error:(e&&e.code)||"error"}); }catch(_){}
    toast(e && e.code ? sampleMsg(e) : dbErr(e)); return false;
  }finally{ const r=Object.assign({},S.running); delete r[post.id]; set({running:r}); }
}
async function decide(post, status, note, apply){
  const rv=S.reviews[post.id]; let ver=null;
  if(apply && rv && rv.result){
    const cur=currentVersion(); const res=rv.result;
    const days=applyChanges(cur.days, res.proposal ? res.proposal.changes : []);
    const adjust=Object.assign({}, cur.adjust||{}); BUDGET_CATS.forEach(c=>adjust[c.id]=(adjust[c.id]||0)+(res.costDelta[c.id]||0));
    const notes=(cur.adjustNotes||[]).concat([{post:post.id, title:post.title, delta:res.costDelta}]);
    ver = await createVersion(days, (res.proposal&&res.proposal.title||post.title)+" (suggested by "+nameOf(post.by)+")", {adjust, adjustNotes:notes, fromPost:post.id});
    if(!ver) return;
    status="incorporated";
  }
  if(await ownerWrite("decisions/post-"+post.id, {status, by:S.me, at:Date.now(), note:note||"", version:ver||null})) toast(status==="incorporated"?"Itinerary "+ver+" created":"Decision saved");
}

function Avatar({id, size}){
  const s=useStore(); const p=s.profiles[id]; const name=nameOf(id);
  if(id==="ai") return html`<span class=${"av "+(size||"")} style=${{background:"var(--ai)"}} title="AI planner">${ic(IC.spark)}</span>`;
  const col=(p&&p.color)||hashColor(id);
  const real = p && p.avatarUrl && !p.avatarUrl.startsWith("data:");
  return html`<span class=${"av "+(size||"")} style=${{background:col}} title=${name}>${real ? html`<img src=${p.avatarUrl} alt=""/>` : name.slice(0,1).toUpperCase()}</span>`;
}
function Who({id, at, extra}){ return html`<div class="row" style="gap:8px"><${Avatar} id=${id} size="sm"/><span class="small"><b>${nameOf(id)}</b>${roleOf(id)==="owner"&&id!=="ai"?html` <span class="tag">Admin</span>`:null} <span class="faint">· ${ago(at)}</span>${extra}</span></div>`; }
function Seg({value, opts, onChange}){
  const tr=useRef(null), hl=useRef(null), first=useRef(true), m=useRef(null);
  m.current=(instant)=>{ const t=tr.current, h=hl.current; if(!t||!h) return; const b=t.children[opts.findIndex(o=>o[0]===value)]; if(instant) h.setAttribute("data-instant",""); if(b){ const L=b.offsetLeft, R=t.offsetWidth-(L+b.offsetWidth); h.style.clipPath=`inset(0 ${R}px 0 ${L}px round 10px)`; } else h.style.clipPath="inset(0 100% 0 0)"; if(instant) requestAnimationFrame(()=>h.removeAttribute("data-instant")); };
  useLayoutEffect(()=>{ m.current(first.current); first.current=false; },[value]);
  useEffect(()=>{ const f=()=>m.current(true); addEventListener("resize",f); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(f); return ()=>removeEventListener("resize",f); },[]);
  return html`<div class="seg" role="tablist"><div class="seg-track" ref=${tr}>${opts.map(([v,l])=>html`<button role="tab" aria-selected=${value===v} class=${value===v?"on":""} onClick=${()=>onChange(v)}>${l}</button>`)}<div class="seg-hl" ref=${hl} aria-hidden="true">${opts.map(([v,l])=>html`<span>${l}</span>`)}</div></div></div>`;
}
function Sheet({title, onClose, children, nodrag}){
  const s=useStore(); const el=useRef(null); const dr=useRef(null);
  useEffect(()=>{ const o=document.body.style.overflow; document.body.style.overflow="hidden"; const k=e=>{ if(e.key==="Escape") onClose(); }; addEventListener("keydown",k); return ()=>{ document.body.style.overflow=o; removeEventListener("keydown",k); }; },[]);
  const down=e=>{ if(nodrag||dr.current||e.target.closest("button")) return; e.currentTarget.setPointerCapture(e.pointerId); dr.current={id:e.pointerId,y:e.clientY,t:Date.now(),dy:0}; const st=el.current.style; st.transition="none"; st.animation="none"; };
  const move=e=>{ const d=dr.current; if(!d||e.pointerId!==d.id) return; let dy=e.clientY-d.y; if(dy<0) dy=-Math.pow(-dy,0.6); d.dy=dy; el.current.style.transform=`translateY(${dy}px)`; };
  const up=e=>{ const d=dr.current; if(!d||e.pointerId!==d.id) return; dr.current=null; const sh=el.current, st=sh.style, v=Math.abs(d.dy)/Math.max(1,Date.now()-d.t);
    if(d.dy>0&&(d.dy>sh.offsetHeight*0.25||v>0.11)){ st.transition="transform 200ms var(--ease-out)"; st.transform="translateY(100%)"; sh.parentNode.style.transition="opacity 200ms ease-out"; sh.parentNode.style.opacity="0"; setTimeout(()=>set({sheet:null, sheetClosing:false}),200); }
    else { st.transition="transform 300ms var(--ease-drawer)"; st.transform="translateY(0)"; setTimeout(()=>{ if(!dr.current){ st.transition=""; st.transform=""; } },300); } };
  return html`<div class=${"sheet-bg"+(s.sheetClosing?" closing":"")} onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}><div class="sheet" ref=${el} role="dialog" aria-modal="true" aria-label=${title}><div class="sheet-head" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}><span class="grab"></span><h2>${title}</h2><button class="icon-btn" onClick=${onClose} aria-label="Close">${ic(IC.x)}</button></div><div class="sheet-body">${children}</div></div></div>`;
}
function VoteBar({target, compact}){
  const s=useStore(); const v=votesFor(target); const mine=s.people[s.me]&&s.people[s.me].votes&&s.people[s.me].votes[target];
  const r=reactsFor(target); const myR=s.people[s.me]&&s.people[s.me].reacts&&s.people[s.me].reacts[target];
  const can=canContribute(); const nc=commentsOn(target).length;

    <button class=${"act "+(mine&&mine.v===-1?"onbad":"")} disabled=${!can} onClick=${()=>vote(target,-1)} aria-label="Vote against">${ic(IC.down)}<span class="num">${v.down.length}</span></button>
    ${compact ? html`<span class="act" style="cursor:default">${ic(IC.chat)}<span class="num">${nc}</span></span>` : ["🔥","😍","🤔","💸"].map(e=>html`<button class=${"act "+(myR&&myR.e===e?"on":"")} disabled=${!can} onClick=${()=>react(target,e)} aria-label=${"React "+e}>${e}${r[e]?html`<span class="num">${r[e].length}</span>`:null}</button>`)}

}
function Thread({target}){
  const s=useStore(); const [text,setText]=useState(""); const [reply,setReply]=useState(null); const [busy,setBusy]=useState(false);
  const all=commentsOn(target).sort((a,b)=>a.at-b.at); const roots=all.filter(c=>!c.parent);
  const send=async()=>{ const t=text.trim(); if(!t) return; setBusy(true); const ok=await addPost({kind:"comment", target, parent:reply?reply.id:null, body:clip(t,1200)}); setBusy(false); if(ok!==false){ setText(""); setReply(null);} };
  const C=(c)=>html`<div class="comment" key=${c.id}><${Avatar} id=${c.by}/><div class="bubble"><div class="small"><b>${nameOf(c.by)}</b> <span class="faint">· ${ago(c.at)}</span></div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${c.body}</div>${canContribute()&&!c.parent?html`<button class="link-btn small" onClick=${()=>setReply(c)}>Reply</button>`:null}</div></div>`;
  return html`<div class="stack" style="gap:12px">
    <div class="eyebrow">Discussion · ${all.length}</div>
    ${roots.length===0 ? html`<div class="small faint">No comments yet. Start the conversation.</div>` : roots.map(c=>html`<div key=${c.id}>${C(c)}${all.some(x=>x.parent===c.id)?html`<div class="replies">${all.filter(x=>x.parent===c.id).map(C)}</div>`:null}</div>`)}
    ${canContribute() ? html`<div class="stack" style="gap:6px">${reply?html`<div class="tiny muted">Replying to ${nameOf(reply.by)} <button class="link-btn tiny" onClick=${()=>setReply(null)}>Cancel</button></div>`:null}
      <div class="composer"><textarea id=${"cm-"+target} class="field grow" placeholder=${reply?"Write a reply":"Add a comment"} value=${text} onInput=${e=>setText(e.target.value)} maxlength="1200" aria-label="Comment"></textarea><button class="btn primary" disabled=${busy||!text.trim()} onClick=${send}>Send</button></div></div>` : html`<div class="small faint">${s.mode==="live"?"Join the trip to comment.":"Open the shared link in Claude to comment."}</div>`}
  </div>`;
}
function Banner(){
  const s=useStore();
  if(s.mode==="offline") return html`<div class="wrap" style="padding-top:12px"><div class="banner info">Preview mode. Open the trip link inside Claude and sign in to vote, comment and see the crew's plans.</div></div>`;
  if(s.mode==="signin") return html`<div class="wrap" style="padding-top:12px"><div class="banner info">Sign in to claude.ai to join the crew.</div></div>`;
  if(s.mode==="revoked") return html`<div class="wrap" style="padding-top:12px"><div class="banner warn">Your access to this trip was removed.</div></div>`;
  if(s.mode==="live" && s.canWrite===false) return html`<div class="wrap" style="padding-top:12px"><div class="banner warn">You can view this trip but not contribute.</div></div>`;
  if(s.mode==="live" && isRemoved(s.me)) return html`<div class="wrap" style="padding-top:12px"><div class="banner warn">Bhargava removed you from this trip's crew.</div></div>`;
  return null;
}

function Countdown(){
  const [now,setNow]=useState(Date.now()); useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),30000); return ()=>clearInterval(t); },[]);
  let ms=DEPART_AT-now;
  if(ms<=0) return html`<div class="count"><div><b>${now<TRIP_END?"On":"Done"}</b><span>${now<TRIP_END?"the trip":"trip"}</span></div></div>`;
  const d=Math.floor(ms/864e5); ms-=d*864e5; const hh=Math.floor(ms/36e5); ms-=hh*36e5; const m=Math.floor(ms/6e4);
  return html`<div class="count" aria-label=${d+" days until the train leaves"}><div><b>${d}</b><span>days</span></div><div><b>${hh}</b><span>hrs</span></div><div><b>${m}</b><span>min</span></div></div>`;
}

function diffVersions(a,b){ const A=flatItems(a.days), B=flatItems(b.days); return {added:Object.keys(B).filter(k=>!A[k]).map(k=>B[k]), removed:Object.keys(A).filter(k=>!B[k]).map(k=>A[k]), changed:Object.keys(B).filter(k=>A[k]&&A[k].text!==B[k].text).map(k=>[A[k],B[k]])}; }

function OwnerDecide({p, rv}){

function feed(){
  const ev=[]; const cur=currentVersion();
  Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const id=p._id;
    if(p.joinedAt) ev.push({at:p.joinedAt, who:id, text:"joined the trip"});
    (p.posts||[]).forEach(x=>{ if(x.kind==="suggestion") ev.push({at:x.at, who:id, text:"suggested “"+clip(x.title,60)+"”", open:["post",{id:x.id}]}); else if(x.kind==="comment") ev.push({at:x.at, who:id, text:(x.parent?"replied on ":"commented on ")+labelFor(x.target), quote:clip(x.body,90)}); });
    (p.expenses||[]).forEach(x=>ev.push({at:x.at, who:id, text:"logged "+inr(x.amount)+" for "+clip(x.note||x.cat,40)+(x.paidBy&&resolvePayer(x.paidBy,id)!==id?", paid by "+nameOf(resolvePayer(x.paidBy,id)):"")}));
    Object.entries(p.polls||{}).forEach(([k,v])=>{ const poll=POLLS.find(q=>"poll-"+q.id===k); const o=poll&&poll.opts.find(z=>z.id===v.o); if(o) ev.push({at:v.at, who:id, text:"voted for "+o.label.split(":")[0]+" on “"+poll.q+"”"}); });
    Object.entries(p.votes||{}).forEach(([k,v])=>{ if(k.startsWith("prop-")) ev.push({at:v.at, who:id, text:(v.v===1?"supported ":"opposed ")+labelFor(k)}); });
  });
  Object.entries(S.reviews).forEach(([k,r])=>{ if(r.state!=="done") return; const p=allPosts().find(x=>x.id===k); if(!p) return; ev.push({at:r.at, who:r.source==="manual"?r.by:"ai", text:(r.source==="manual"?"reviewed “":"reviewed “")+clip(p.title,50)+"”: "+(r.result&&r.result.summary?clip(r.result.summary,90):""), open:["post",{id:k}]}); });
  Object.entries(S.decisions).forEach(([k,d])=>{ if(k.startsWith("post-")){ const p=allPosts().find(x=>x.id===k.slice(5)); ev.push({at:d.at, who:d.by, text:(d.status==="rejected"?"rejected “":d.status==="incorporated"?"added to the itinerary “":"approved “")+(p?clip(p.title,50):"a suggestion")+"”", open:p?["post",{id:p.id}]:null}); } else if(k.startsWith("poll-")){ const poll=POLLS.find(q=>"poll-"+q.id===k); const o=poll&&poll.opts.find(z=>z.id===d.choice); ev.push({at:d.at, who:d.by, text:"locked the decision: "+(o?o.label:d.choice)}); } });
  versions().forEach(v=>ev.push({at:v.at, who:v.by, text:"published itinerary v"+v.n+": "+clip(v.why,80)+(v._id===cur._id?" (current)":"")}));
  Object.values(S.bookings).forEach(b=>{ if(b.updatedAt&&b.updatedBy) ev.push({at:b.updatedAt, who:b.updatedBy, text:"marked "+b.title+" as "+b.status}); });
  return ev.filter(e=>e.at).sort((a,b)=>b.at-a.at).slice(0,120);
}

function Donut({parts, size}){
  const total=parts.reduce((a,p)=>a+p.v,0)||1; let acc=0; const r=52, c=2*Math.PI*r;
  return html`<svg viewBox="0 0 132 132" style=${{width:size||132,height:size||132}} role="img" aria-label="Budget split"><circle cx="66" cy="66" r=${r} fill="none" stroke="var(--surface-2)" stroke-width="18"/>
    ${parts.filter(p=>p.v>0).map(p=>{ const len=p.v/total*c; const el=html`<circle key=${p.label} cx="66" cy="66" r=${r} fill="none" stroke=${p.color} stroke-width="18" stroke-dasharray=${len+" "+(c-len)} stroke-dashoffset=${-acc} transform="rotate(-90 66 66)"/>`; acc+=len; return el; })}
    <text x="66" y="62" text-anchor="middle" font-size="11" fill="var(--ink-3)">group</text><text x="66" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${"₹"+Math.round(total/1000)+"k"}</text></svg>`;
}

    <div><span class="lbl">Status</span><div class="chips">${BK_STATUS.map(([k,l])=>html`<button type="button" key=${k} class=${"chip "+(f.status===k?"on":"")} onClick=${()=>up("status",k)}>${l}</button>`)}</div></div>
    ${F("detail","Details")}${F("when","When to book","e.g. This week")}
    <div class="row"><div class="grow"><label class="lbl" for="bk-amount">Price, ₹</label><input id="bk-amount" class="field num" inputmode="numeric" value=${f.amount||""} onInput=${e=>up("amount",e.target.value.replace(/[^0-9]/g,""))}/></div><div><span class="lbl">Price type</span><div class="chips">${[["est","Est."],["listed","Listed"],["verified","Verified"]].map(([k,l])=>html`<button type="button" key=${k} class=${"chip "+(f.priceType===k?"on":"")} onClick=${()=>up("priceType",k)}>${l}</button>`)}</div></div></div>
    ${F("ref","Booking reference / PNR")}${F("contact","Contact")}${F("cancel","Cancellation policy")}${F("link","Booking link","https://")}
    <button class="btn primary block" disabled=${busy||!f.title.trim()} onClick=${save}>Save</button>
    ${b?html`<button class="btn danger sm" style="align-self:flex-start" onClick=${async()=>{ try{ await API.db.doc("bookings/"+id).delete(); closeSheet(); toast("Booking removed"); }catch(e){ toast(dbErr(e)); } }}>Delete</button>`:null}
    ${b?html`<${Thread} target=${"bk-"+id}/>`:null}
  <//>`;
}

/* ====================================================================
   12. ASK THE PLANNER
   ==================================================================== */
function AskSheet(){
  const s=useStore(); const [q,setQ]=useState(""); const [a,setA]=useState(""); const [busy,setBusy]=useState(false); const ctl=useRef(null);
  const ask=async e=>{ e&&e.preventDefault(); if(!q.trim()||!API.sample) return; setBusy(true); setA("Thinking…"); ctl.current=new AbortController();
    try{ await API.sample(`You are the AI trip planner for "Kerala Trip HQ" (3 friends, Kerala, 22–26 Dec 2026). Answer the traveller's question in under 180 words, specific to this trip and its current itinerary. You cannot browse: say when something is from general knowledge and must be verified. Plain text, short paragraphs or "- " bullets.\n\nTRIP DATA: ${JSON.stringify(tripContext())}\n\nQUESTION from ${nameOf(s.me)}: ${q.trim()}`, {signal:ctl.current.signal, onText:({text})=>setA(text)}); }
    catch(err){ setA(err.text||""); if(err.code!=="cancelled") toast(sampleMsg(err)); }
    setBusy(false); };
  const share=async()=>{ if(!a||!canContribute()) return; const ok=await addPost({kind:"suggestion", cat:"other", title:clip("Q: "+q.trim(),120), body:clip("AI planner answer:\n"+a,1500), cost:0, target:null}); if(ok!==false){ toast("Shared to the Crew board"); closeSheet(); } };
  return html`<${Sheet} title="Ask the AI planner" onClose=${closeSheet}>
    ${!s.sampleOK?html`<div class="banner warn small">AI is only available when this trip is opened inside Claude and signed in.</div>`:html`<form class="stack" onSubmit=${ask}>
      <div class="chips">${["Is Kolukkumalai worth the 04:45 start?","What should we pack for Munnar in December?","Cheapest way to cut ₹10,000?"].map(t=>html`<button type="button" class="chip" key=${t} onClick=${()=>setQ(t)}>${t}</button>`)}</div>
      <textarea id="ask-q" class="field" placeholder="Ask anything about the trip" value=${q} onInput=${e=>setQ(e.target.value)}></textarea>
      <div class="row"><button class="btn ai grow" type="submit" disabled=${busy||!q.trim()}>${busy?html`<span class="spinner"></span> Asking…`:"Ask"}</button>${busy?html`<button type="button" class="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Stop</button>`:null}</div></form>`}
    ${a?html`<div class="ai-box"><h4>Answer</h4><div class="small" style="white-space:pre-wrap">${a}</div><div class="tiny faint">Not live-verified. Answers aren't saved unless you share them.</div>${!busy&&canContribute()?html`<button class="btn sm" onClick=${share}>Share to the Crew board</button>`:null}</div>`:null}
  <//>`;
}

/* ====================================================================
   13. SHELL
   ==================================================================== */
const TABS=[["home","Home","home"],["explore","Explore","explore"],["itinerary","Itinerary","itin"],["crew","Crew","crew"],["budget","Budget","budget"]];
const tabFromHash=()=>{ const t=(location.hash||"").slice(1); return TABS.some(x=>x[0]===t)?t:"home"; };
function SheetHost(){
  const s=useStore(); const sh=s.sheet;
  const needJoin = s.mode==="live" && s.loaded.people && !s.people[s.me] && s.canWrite!==false;
  if(needJoin && (!sh || sh.type!=="join")) return html`<${JoinSheet}/>`;
  if(!sh) return null; const p=sh.props;
  switch(sh.type){
    case "dest": return html`<${DestSheet} ...${p}/>`; case "item": return html`<${ItemSheet} ...${p}/>`; case "versions": return html`<${VersionsSheet} ...${p}/>`;
    case "newpost": return canContribute()?html`<${NewPostSheet} ...${p}/>`:null; case "post": return html`<${PostSheet} ...${p}/>`;
    case "expense": return canContribute()?html`<${ExpenseSheet}/>`:null; case "booking": return html`<${BookingSheet} ...${p}/>`;
    case "join": return html`<${JoinSheet} ...${p}/>`; case "ask": return s.isOwner?html`<${AskSheet}/>`:null;
  } return null;
}
const autoTried=new Set(); let autoBusy=false;
function App(){
  const s=useStore(); const [tab,setTab]=useState(tabFromHash());
  useEffect(()=>{ const f=()=>setTab(tabFromHash()); addEventListener("hashchange",f); return ()=>removeEventListener("hashchange",f); },[]);
  const go=t=>{ try{ history.replaceState(null,"","#"+t); }catch(e){ location.hash=t; } setTab(t); window.scrollTo(0,0); };
  const wIds=s.isOwner&&s.sampleOK&&s.mode==="live"&&canContribute()?awaitingReview().map(p=>p.id).join(","):"";
  useEffect(()=>{ if(!wIds||autoBusy) return; (async()=>{ autoBusy=true; for(const id of wIds.split(",")){ if(autoTried.has(id)) continue; autoTried.add(id); const post=allPosts().find(x=>x.id===id); if(post&&statusOf(post)==="new"){ const ok=await runReview(post); if(!ok) break; } } autoBusy=false; })(); },[wIds]);
  const badge=awaitingReview().length+pendingDecisions().filter(x=>x.kind==="post").length;
  return html`<div class="app">
    ${tab!=="home"?html`<${Banner}/>`:null}
    <main key=${tab} class="view">${tab==="home"?html`<${Home} go=${go}/>`:tab==="explore"?html`<${Explore}/>`:tab==="itinerary"?html`<${Itinerary}/>`:tab==="crew"?html`<${Crew}/>`:html`<${Budget}/>`}</main>
    
    <nav class="nav" aria-label="Main"><div class="nav-in">${TABS.map(([k,l,icn])=>html`<button key=${k} class=${"navbtn "+(tab===k?"on":"")} aria-current=${tab===k?"page":null} onClick=${()=>go(k)}><span class="ic">${ic(IC[icn])}</span>${l}${k==="crew"&&badge?html`<span class="badge">${badge}</span>`:null}</button>`)}</div></nav>
    <${SheetHost}/>
    <div class="toasts" aria-live="polite">${s.toasts.map(t=>html`<div class=${"toast"+(t.leaving?" leaving":"")} key=${t.id}>${t.msg}</div>`)}</div>
  </div>`;
}
render(html`<${App}/>`, document.getElementById("app"));
boot().catch(()=>set({mode:"offline"}));
})();
</script>
