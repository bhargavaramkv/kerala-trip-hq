<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kerala Trip HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Design: Apple-style. System type, neutral greys, one blue accent, inset grouped lists, generous whitespace. No borders or shadows on content; colour is used for meaning only. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --fill:#e8e8ed; --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --ink-4:#86868b; --line:#e0e0e5; --sep:rgba(60,60,67,.14);
  --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:rgba(0,113,227,.09);
  --brand:var(--accent); --brand-ink:#ffffff;
  --ok:#248a3d; --ok-bg:rgba(36,138,61,.1); --warn:#b25000; --warn-bg:rgba(178,80,0,.09); --bad:#d70015; --bad-bg:rgba(215,0,21,.08); --info:#0071e3; --info-bg:rgba(0,113,227,.09); --ai:#6e6e73; --ai-bg:#f5f5f7;
  --leaf:#248a3d; --laterite:#0071e3; --turmeric:#bf4800; --sea:#0071e3;
  --k-sight:#0071e3; --k-food:#bf4800; --k-stay:#8944ab; --k-logistics:#86868b; --k-rest:#5e5ce6; --k-drive:#86868b;
  --shadow:0 4px 24px rgba(0,0,0,.08); --shadow-sm:none;
  --ease-out:cubic-bezier(0.25,0.1,0.25,1); --ease-in-out:cubic-bezier(0.42,0,0.58,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --map-sea:#CFE3E6; --map-land:#E9F0DF; --map-hill:#CFE0C3; --map-ink:#3B5246; --map-route:#B0502A; --map-back:#1E6A7B; --map-dot:#1D5A3E;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:18px; --r-sm:12px; --nav-h:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:#3a3a3c; --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#8e8e93; --line:#38383a; --sep:rgba(84,84,88,.6);
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.14); --ok:#30d158; --ok-bg:rgba(48,209,88,.14); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14); --bad:#ff453a; --bad-bg:rgba(255,69,58,.14); --info:#2997ff; --info-bg:rgba(41,151,255,.14); --ai-bg:#2c2c2e;
  --leaf:#30d158; --turmeric:#ff9f0a; --k-sight:#2997ff; --k-food:#ff9f0a; --k-stay:#bf5af2; --k-rest:#7d7aff;
  --map-sea:#10303A; --map-land:#1A2A20; --map-hill:#21382A; --map-ink:#B9CDBF; --map-route:#E8906A; --map-back:#79C6D5; --map-dot:#84CF9F; --shadow:0 4px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:#3a3a3c; --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#8e8e93; --line:#38383a; --sep:rgba(84,84,88,.6);
  --accent:#2997ff; --accent-soft:rgba(41,151,255,.14); --ok:#30d158; --ok-bg:rgba(48,209,88,.14); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14); --bad:#ff453a; --bad-bg:rgba(255,69,58,.14); --info:#2997ff; --info-bg:rgba(41,151,255,.14); --ai-bg:#2c2c2e;
  --leaf:#30d158; --turmeric:#ff9f0a; --k-sight:#2997ff; --k-food:#ff9f0a; --k-stay:#bf5af2; --k-rest:#7d7aff;
  --map-sea:#10303A; --map-land:#1A2A20; --map-hill:#21382A; --map-ink:#B9CDBF; --map-route:#E8906A; --map-back:#79C6D5; --map-dot:#84CF9F; --shadow:0 4px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation}
.btn,.chip,.act,.navbtn,.seg button,.quick button{-webkit-user-select:none;user-select:none}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.app{max-width:600px;margin:0 auto;min-height:100dvh;overflow-x:clip;padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)} .faint{color:var(--ink-4)} .small{font-size:15px;letter-spacing:-.01em} .tiny{font-size:13px;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:-.005em;color:var(--ink-3)}
.page-head{padding-top:30px;padding-bottom:2px}
.page-head .eyebrow{font-size:15px;color:var(--ink-3);font-weight:600}
.page-head h1{font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:22px;padding:0 2px}
.section-title h2{font-size:22px;font-weight:700;letter-spacing:-.022em}
.link-btn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:400;cursor:pointer;min-height:32px;font-size:17px}
.section-title .link-btn::after{content:" ›"}
.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px 20px;box-shadow:none}
.card.tight{padding:14px 16px}
.card.press{cursor:pointer}
.btn,.chip,.act,.icon-btn,.seg button,.quick button,.link-btn{transition:transform 150ms var(--ease-out),background-color 150ms ease,opacity 150ms ease,color 150ms ease}
.btn:active:not(:disabled),.chip:active:not(:disabled),.act:active:not(:disabled),.icon-btn:active:not(:disabled),.quick button:active:not(:disabled){transform:scale(.97)}
.card.press,.day-head,.item,.hrow,.gl,.tl-row{transition:opacity 150ms ease}
.card.press:active,.hrow:active,.gl:active{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:980px;border:0;background:var(--fill);color:var(--accent);font-weight:400;font-size:17px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ai{background:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 16px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.navbtn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.hrow:focus-visible,.gl:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--ink-3)}
.icon-btn svg,.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface);border-radius:980px;padding:0 16px;min-height:36px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:400;font-size:15px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface)}
.chip .dot{display:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;background:none!important;padding:0;font-size:15px;font-weight:400;white-space:nowrap;letter-spacing:-.01em}
.pill svg{width:14px;height:14px}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--ink-3)} .pill.ai{color:var(--ink-3)} .pill.neutral{color:var(--ink-3)}
.tag{font-size:13px;font-weight:400;border-radius:0;padding:0;background:none;color:var(--ink-4);white-space:nowrap}
.tag.listed,.tag.est,.tag.verified,.tag.gk{background:none;color:var(--ink-4)}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:7px;min-height:32px;padding:0 12px;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;letter-spacing:-.01em}
.seg-track{position:relative;display:flex;gap:0;flex:1 0 auto;min-width:100%}
.seg-hl{position:absolute;inset:0;display:flex;gap:0;pointer-events:none;transition:clip-path 250ms var(--ease-out)}
.seg-hl span{flex:1 0 auto;display:flex;align-items:center;justify-content:center;border-radius:7px;min-height:32px;padding:0 12px;font-weight:600;font-size:14px;white-space:nowrap;background:var(--surface);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);letter-spacing:-.01em}
:root[data-theme="dark"] .seg-hl span{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg-hl span{background:#636366}}
.seg-hl[data-instant]{transition:none}
.seg button,.seg-hl span{flex:1 1 0;min-width:0;font-weight:600;padding:0 8px;overflow:hidden;text-overflow:ellipsis}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{scroll-snap-align:start;flex:none}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;font-weight:600;font-size:14px;color:#fff;border:2px solid var(--surface)}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:16px;height:16px}
.av.lg{width:56px;height:56px;font-size:22px}
.av.sm{width:26px;height:26px;font-size:12px;border-width:1.5px}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.bar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden;display:flex}
.bar>span{height:100%;display:block;background:var(--accent)!important}
.scene{position:relative;overflow:hidden;background:var(--surface-2)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-art{position:relative;border-radius:28px;overflow:hidden;height:340px}
.hero-art .scene{position:absolute;inset:0}
.hero-art .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 48%,rgba(0,0,0,.62) 100%)}
.hero-text{position:absolute;left:0;right:0;bottom:0;padding:0 22px 22px;color:#fff;text-align:left}
.hero-date{position:absolute;left:22px;top:20px;font-size:15px;font-weight:600;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.hero-text h1{font-size:68px;line-height:1;font-weight:700;letter-spacing:-.045em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero-art .count{position:static;margin:14px 0 0;gap:8px;justify-content:flex-start;color:#fff}
.hero-art .count div{text-align:left;background:rgba(255,255,255,.16);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-radius:16px;padding:10px 14px 9px;min-width:74px;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
.hero-art .count b{font-size:28px}
.hero-art .count span{color:rgba(255,255,255,.85);margin-top:3px}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;margin-inline:-20px;padding:2px 20px 4px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gcard{flex:none;width:210px;scroll-snap-align:start;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--surface);text-align:left;cursor:pointer;font:inherit;color:inherit}
.gcard:active{opacity:.7}
.gcard .scene{height:128px}
.gcard .gb{padding:12px 16px 14px}
.gcard .gb b{display:block;font-size:17px;font-weight:600}
.gcard .gb span{font-size:13px;color:var(--ink-3)}
.dart{border-radius:22px;overflow:hidden;height:210px;position:relative}
.dart .scene{position:absolute;inset:0}
input.field,textarea.field,select.field{width:100%;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;min-height:46px;font-size:17px;box-shadow:inset 0 0 0 1px var(--line)}
input.field:focus,textarea.field:focus,select.field:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
textarea.field{min-height:92px;resize:vertical}
label.lbl{font-weight:400;font-size:13px;color:var(--ink-3);display:block;margin:0 0 6px 4px}
.banner{border-radius:var(--r);padding:14px 18px;font-size:15px;display:flex;gap:10px;align-items:flex-start;background:var(--surface);color:var(--ink-2)}
.banner.info,.banner.warn,.banner.ai{background:var(--surface);color:var(--ink-2)}
.banner.warn b,.banner.warn{color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;gap:12px;padding:12px 0;border-top:.5px solid var(--sep);align-items:flex-start}
.list>.li:first-child{border-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.kv.tight{gap:6px 14px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink-2)}
ul.clean li::marker{color:var(--ink-4)}

/* home */
.hero{padding-top:18px;padding-bottom:0;text-align:left}
.hero .kicker{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.hero h1{font-size:56px;line-height:1.04;font-weight:700;letter-spacing:-.04em;margin-top:6px}
.hero .tagline{font-size:21px;color:var(--ink-3);margin-top:8px;letter-spacing:-.02em;line-height:1.3}
.count{display:flex;justify-content:center;gap:28px;margin-top:26px}
.count div{text-align:center;min-width:56px}
.count b{display:block;font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count span{display:block;font-size:13px;color:var(--ink-3);margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:0;border-radius:var(--r);padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:118px;font:inherit;color:inherit}
.tile:active{opacity:.6}
.tile .t-l{font-size:13px;color:var(--ink-3);font-weight:600}
.tile .t-v{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:auto;font-variant-numeric:tabular-nums}
.tile .t-s{font-size:13px;color:var(--ink-3)}
.quick{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px}
.quick button{border:0;background:var(--surface);border-radius:var(--r);min-height:52px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;font-size:17px;color:var(--accent);cursor:pointer}
.quick svg{width:18px;height:18px}
.quick.slim button{min-height:52px}
.snap{display:grid;grid-template-columns:repeat(3,1fr);padding:0;overflow:hidden}
.snap button{background:none;border:0;border-left:.5px solid var(--sep);padding:16px 4px 14px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.snap button:first-child{border-left:0}
.snap b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15;white-space:nowrap;letter-spacing:-.03em}
.snap span{font-size:13px;color:var(--ink-3)}

/* inset grouped lists */
.hlist{padding:0 0 0 20px}
.hrow{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:13px 20px 13px 0;text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative;min-height:52px}
.hrow+.hrow,.hlist>div+div>.hrow,.hlist>.hrow+div>.hrow,.hlist>div+.hrow{box-shadow:inset 0 .5px 0 var(--sep)}
.hrow .grow{min-width:0}
.hrow b{font-weight:400}
.hrow .sub{display:block;font-size:15px;color:var(--ink-3);margin-top:1px;letter-spacing:-.01em}
.hrow>svg:last-child{color:var(--ink-4);width:16px;height:16px;flex:none}
.ico{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#fff}
.ico svg{width:17px;height:17px}
.ico.g{background:#34c759} .ico.o{background:#ff9500} .ico.p{background:#af52de} .ico.gr{background:#8e8e93} .ico.i{background:#5856d6}
.ck{width:22px;height:22px;flex:none;border:1.5px solid var(--ink-4);border-radius:50%}
.ck.on{background:var(--ok);border-color:var(--ok);display:grid;place-items:center;color:#fff}
.ck.on svg{width:13px;height:13px}
.sleep{display:block}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.chips.scrollx::-webkit-scrollbar{display:none}
.chips.scrollx .chip{flex:none}
details.fold{padding:0}
details.fold>summary{list-style:none;cursor:pointer;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:400}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-4);border-bottom:2px solid var(--ink-4);transform:rotate(45deg);margin:-4px 4px 0 10px;transition:transform 200ms var(--ease-out)}
details.fold[open]>summary:after{transform:rotate(225deg);margin-top:4px}
details.fold>.fold-body{padding:0 20px 18px}
.thumb{width:58px;height:58px;flex:none;border-radius:13px;overflow:hidden;position:relative}
.thumb .scene{position:absolute;inset:0;height:100%!important}
.footnote{font-size:13px;color:var(--ink-3);padding:0 20px;line-height:1.4}

/* destination sheet header */
.dhead{padding:6px 0 2px}
.dhead .eyebrow{font-size:15px}
.dhead h3{font-size:34px;letter-spacing:-.03em}

/* itinerary */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border-radius:var(--r);padding:16px 4px}
.stat{text-align:center;border-left:.5px solid var(--sep)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;white-space:nowrap;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--ink-3)}
.glance{padding:0 0 0 20px}
.gl{display:flex;gap:14px;align-items:center;width:100%;background:none;border:0;padding:12px 20px 12px 0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.gl+.gl{box-shadow:inset 0 .5px 0 var(--sep)}
.gl .grow{min-width:0}
.gl b{font-weight:600}
.gl-sub{display:block;font-size:15px;color:var(--ink-3);margin-top:1px;letter-spacing:-.01em}
.datebox{width:48px;flex:none;border-radius:11px;background:var(--surface);color:var(--ink);text-align:center;padding:5px 0 6px;box-shadow:inset 0 0 0 .5px var(--sep),0 1px 2px rgba(0,0,0,.06)}
.datebox span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;color:#ff3b30;order:-1}
.datebox{display:flex;flex-direction:column}
.datebox b{font-family:var(--f-display);font-size:24px;font-weight:400;display:block;line-height:1;letter-spacing:-.03em;margin-top:1px}
.datebox.sm{width:44px;padding:4px 0 5px;border-radius:10px}

const S = {mode:"loading", me:null, isOwner:false, canWrite:null, people:{}, roster:{}, reviews:{}, decisions:{}, itin:{}, bookings:{}, meta:{}, requests:{}, profiles:{}, loaded:{}, running:{}, sheet:null, toasts:[], sampleOK:false};

async function boot(){
  if(!window.claude || !window.claude.use){ set({mode:"offline"}); return; }
  const [db,user,sample] = await Promise.all(["db","user","sample"].map(n=>window.claude.use(n).catch(()=>null)));
  API = {db,user,sample};
  if(!db || !user){ set({mode:"offline"}); return; }
  const me = await user.me();
  if(!me.id){ set({mode:"signin"}); return; }
  const canWrite = await user.can("data.write");
  set({me:me.id, isOwner:!!me.isOwner, canWrite, mode:"live", sampleOK:!!sample});
  const sub = (col,key) => db.collection(col).onSnapshot(snap => {
    const o={}; snap.docs.forEach(d=>{ o[d.id]=Object.assign({_id:d.id}, d.data()); });
    set({[key]:o, loaded:Object.assign({},S.loaded,{[key]:true})});
    if(key==="people") refreshProfiles();
    if(key==="roster") ensureOwnerRoster();
  }, e => { if(e.code==="revoked") set({mode:"revoked"}); else toast("Live updates paused ("+e.code+"). Reload to reconnect."); });
  sub("people","people"); sub("roster","roster"); sub("reviews","reviews"); sub("decisions","decisions");
  sub("itinerary","itin"); sub("bookings","bookings"); sub("meta","meta");
}

}

/* --- my own document: everything a person contributes lives in people/<their id> --- */
let wq = Promise.resolve();
function mutateMe(fn){
  if(!canContribute()){ toast("You can view but not contribute here."); return Promise.resolve(false); }
  wq = wq.then(async ()=>{
    const cur = clone(S.people[S.me]) || {}; delete cur._id;
    cur.posts=cur.posts||[]; cur.expenses=cur.expenses||[]; cur.votes=cur.votes||{}; cur.reacts=cur.reacts||{}; cur.polls=cur.polls||{};
    fn(cur); cur.updatedAt=Date.now();
    await API.db.doc("people/"+S.me).set(cur); return true;
  }).catch(e=>{ toast(dbErr(e)); return false; });
  return wq;
}
const canContribute = () => S.mode==="live" && S.canWrite!==false && !!S.people[S.me] && !isRemoved(S.me);

function members(){
  return Object.values(S.people).filter(p=>!isRemoved(p._id)).sort((a,b)=>(roleOf(b._id)==="owner")-(roleOf(a._id)==="owner") || (a.joinedAt||0)-(b.joinedAt||0));
}
const roleOf = id => (S.roster[id] && S.roster[id].role) || (id===S.me && S.isOwner ? "owner" : "member");
function nameOf(id){ if(id==="ai") return "Trip planner"; if(String(id).startsWith("name:")) return id.slice(5); const p=S.people[id]; const pr=S.profiles[id]; return (p&&p.nick) || (pr&&pr.name) || "Traveller"; }
function allPosts(){ const out=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; (p.posts||[]).forEach(x=>out.push(Object.assign({by:p._id},x))); }); return out; }
const CREW_NAMES=["Bhargava","Sahith","Manoj","Darshan"];
const CREW_SIZE=CREW_NAMES.length;
function resolvePayer(pid, logger){ if(!pid) return logger; if(S.people[pid]) return pid; if(String(pid).startsWith("name:")){ const n=pid.slice(5).toLowerCase(); const m=Object.values(S.people).find(q=>!isRemoved(q._id)&&String(q.nick||"").toLowerCase()===n); return m?m._id:pid; } return logger; }
function payerOptions(){ const mem=members(); const ids=mem.map(m=>m._id); CREW_NAMES.forEach(n=>{ if(!mem.some(m=>String(m.nick||"").toLowerCase()===n.toLowerCase())) ids.push("name:"+n); }); return ids; }
function allExpenses(){ const out=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; (p.expenses||[]).forEach(x=>out.push(Object.assign({},x,{by:p._id, payer:resolvePayer(x.paidBy,p._id)}))); }); return out.sort((a,b)=>b.at-a.at); }
function votesFor(target){ const up=[],down=[]; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const v=p.votes&&p.votes[target]; if(v&&v.v===1) up.push(p._id); if(v&&v.v===-1) down.push(p._id); }); return {up,down}; }
function reactsFor(target){ const m={}; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const r=p.reacts&&p.reacts[target]; if(r&&r.e){ (m[r.e]=m[r.e]||[]).push(p._id);} }); return m; }
function pollWinner(pid){ const m=pollVotes("poll-"+pid); const a=Object.entries(m).map(([k,v])=>[k,v.length]).sort((x,y)=>y[1]-x[1]); return a.length&&a[0][1]>0&&(a.length<2||a[0][1]>a[1][1])?a[0][0]:null; }
function pollVotes(pid){ const m={}; Object.values(S.people).forEach(p=>{ if(isRemoved(p._id)) return; const v=p.polls&&p.polls[pid]; if(v&&v.o){ (m[v.o]=m[v.o]||[]).push(p._id);} }); return m; }
const commentsOn = target => allPosts().filter(p=>p.kind==="comment" && p.target===target);

function versions(){ return Object.values(S.itin).filter(v=>v.days && v._id!=="draft").sort((a,b)=>b.n-a.n); }
function baseVersion(){ return {_id:"base", n:0, plan:"A", days:PLAN_AB, status:"draft", why:"Research baseline: 8-day car trip (not saved yet)", adjust:{}, unsaved:true}; }
function currentVersion(){ const m=S.meta.state; if(m && m.current && S.itin[m.current]) return S.itin[m.current]; const v=versions(); return v[0] || baseVersion(); }
function projection(v){
  const cat={}; BUDGET_CATS.forEach(c=>cat[c.id]=0);
  const bud=S.meta&&S.meta.budget; const known=!!(bud&&Array.isArray(bud.items));
  if(known) bud.items.forEach(x=>{ if(x.cat in cat) cat[x.cat]+=Number(x.amount)||0; });
  else { (v.days||[]).forEach(d=>BUDGET_CATS.forEach(c=>cat[c.id]+=(d.cost&&d.cost[c.id])||0)); Object.entries(v.adjust||{}).forEach(([k,x])=>{ if(k in cat) cat[k]+=Number(x)||0; }); }
  const sub=Object.values(cat).reduce((a,b)=>a+b,0); const cont=known?0:Math.round(sub*CONTINGENCY);
  return {cat, sub, cont, total:sub+cont, known};
}
function flatItems(days){ const m={}; (days||[]).forEach((d,di)=>SLOTS.forEach(([sl])=>((d.slots&&d.slots[sl])||[]).forEach(it=>{ m[it.id]=Object.assign({day:di+1, slot:sl, date:d.dow+" "+d.dd+" Dec"},it); }))); return m; }
function findItem(id){ const v=currentVersion(); const m=flatItems(v.days); if(m[id]) return m[id]; for(const x of versions()){ const mm=flatItems(x.days); if(mm[id]) return mm[id]; } return flatItems(PLAN_AB)[id]||null; }
function labelFor(target){
  if(!target) return "the trip";

  if(target.startsWith("poll-")){ const p=POLLS.find(x=>"poll-"+x.id===target); return p?p.q:"a decision"; }

  if(target.startsWith("bk-")){ const b=S.bookings[target.slice(3)]; return b?b.title:"a booking"; }
  const it=findItem(target); if(it) return "“"+clip(it.text,46)+"”";

}
function statusOf(post){
  const d=S.decisions["post-"+post.id]; if(d) return d.status;

function statusPill(post){

  if(s==="ai"){ const v=S.reviews[post.id].result&&S.reviews[post.id].result.verdict; return v==="not_recommended" ? html`<span class="pill bad">AI: not recommended</span>` : v==="needs_info" ? html`<span class="pill warn">AI: needs info</span>` : html`<span class="pill ai">AI recommended</span>`; }

function reviewPrompt(post){

  return `You are the AI trip planner inside "Kerala Trip HQ", a private app four friends use to plan a Kerala trip on 22–29 December 2026 (8 days, one self-drive car). Review ONE suggestion from a traveller and give the group a decisive, specific recommendation.

Working rules:
- Evaluate travel time, distance, season (late December: dry, cool hills, peak Christmas crowds), likely opening hours, and fit with the current itinerary below.
- Calculate the budget impact for the whole group in INR, by category. Use 0 where nothing changes.
- Challenge impractical ideas. Do not accept everything. If it doesn't fit, say so and offer the closest workable alternative.
- If it fits only by dropping something, name exactly what to drop (by item id).
- If it conflicts with another traveller's suggestion, propose a compromise.
- You cannot browse the web. Mark every fact as basis "trip data" (from the data below), "general knowledge" (your own knowledge; may be outdated) or "estimate". Never claim live prices, availability or confirmed timings. List what must be verified before booking.
- Be concrete: real place names, times, distances, rupee amounts. No generic advice.

TRIP DATA (JSON):
${JSON.stringify(tripContext())}

SUGGESTION (JSON):
${JSON.stringify({author:nameOf(post.by), category:(CATS.find(c=>c.id===post.cat)||{}).label, title:post.title, details:post.body, estimatedCostByAuthor:post.cost||null, attachedTo:target})}

GROUP COMMENTS ON IT: ${JSON.stringify(comments)}
OTHER OPEN SUGGESTIONS: ${JSON.stringify(others)}

Reply with ONLY a JSON object of this shape:
{"summary":"one sentence verdict for a phone screen",
 "verdict":"recommend" | "recommend_with_changes" | "not_recommended" | "needs_info",
 "fit":"2-3 sentences on how it fits the 8-day plan",
 "facts":[{"text":"...","basis":"trip data"|"general knowledge"|"estimate"}],
 "travel":{"extraKm":number|null,"extraHours":number|null,"note":"..."},
 "costDelta":{"transport":0,"stays":0,"food":0,"activities":0,"misc":0},
 "conflicts":["..."],
 "alternatives":["..."],
 "pros":["..."], "cons":["..."],
 "reasoning":"why this recommendation is good for this group",
 "proposal": null | {"title":"short name of the change","current":"what the plan says now","proposed":"what it would say","changes":[{"day":1-5,"op":"add"|"replace"|"remove","slot":"morning"|"afternoon"|"evening"|"optional","itemId":"existing item id for replace/remove","time":"HH:MM or empty","text":"new item text for add/replace"}]},
 "checkBeforeBooking":["..."]}
Use "proposal": null when the itinerary should not change (for example a restaurant that fits an existing meal slot, or a rejected idea).`;
}
const arr = (x,n) => Array.isArray(x) ? x.filter(s=>typeof s==="string"&&s.trim()).slice(0,n).map(s=>clip(s,400)) : [];
function sanitizeReview(r){
  r = r||{}; const cd={}; BUDGET_CATS.forEach(c=>{ const v=Number(r.costDelta&&r.costDelta[c.id]); cd[c.id]=isFinite(v)?Math.round(v):0; });
  let prop=null;
  if(r.proposal && typeof r.proposal==="object"){
    const ids=flatItems(currentVersion().days);
    const ch=(Array.isArray(r.proposal.changes)?r.proposal.changes:[]).slice(0,8).map(c=>({day:Math.max(1,Math.min(5,c.day|0)), op:["add","replace","remove"].includes(c.op)?c.op:"add", slot:SLOTS.some(s=>s[0]===c.slot)?c.slot:"optional", itemId:typeof c.itemId==="string"?c.itemId:"", time:typeof c.time==="string"?clip(c.time,5):"", text:clip(c.text||"",200)})).filter(c=>c.op==="add" ? c.text : ids[c.itemId] && (c.op==="remove"||c.text));
    prop={title:clip(r.proposal.title||"Proposed change",90), current:clip(r.proposal.current||"",400), proposed:clip(r.proposal.proposed||"",400), changes:ch};
  }
  const t=r.travel||{};
  return {summary:clip(r.summary||"",240), verdict:["recommend","recommend_with_changes","not_recommended","needs_info"].includes(r.verdict)?r.verdict:"needs_info",
    fit:clip(r.fit||"",700), facts:(Array.isArray(r.facts)?r.facts:[]).slice(0,8).map(f=>({text:clip(f&&f.text||"",300), basis:["trip data","general knowledge","estimate"].includes(f&&f.basis)?f.basis:"estimate"})).filter(f=>f.text),
    travel:{extraKm:isFinite(Number(t.extraKm))&&t.extraKm!==null?Number(t.extraKm):null, extraHours:isFinite(Number(t.extraHours))&&t.extraHours!==null?Number(t.extraHours):null, note:clip(t.note||"",300)},
    costDelta:cd, conflicts:arr(r.conflicts,5), alternatives:arr(r.alternatives,5), pros:arr(r.pros,5), cons:arr(r.cons,5), reasoning:clip(r.reasoning||"",900), proposal:prop, checkBeforeBooking:arr(r.checkBeforeBooking,6)};
}
function sampleMsg(e){ const c=e&&e.code; if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled") return "Claude isn't allowed on this page for you. Use the manual review instead."; if(c==="rate_limited") return "Claude is busy or your usage limit is reached. Try again later."; if(c==="invalid_json") return "Claude's answer wasn't readable. Try again."; if(c==="cancelled") return "Review stopped."; if(c==="session_expired") return "Sign in to claude.ai again, then retry."; return "The AI review failed. Try again in a moment."; }
async function runReview(post){
  if(!API.sample){ toast("AI isn't available in this view."); return false; }
  set({running:Object.assign({},S.running,{[post.id]:true})});
  const ref=API.db.doc("reviews/"+post.id);
  try{
    await ref.set({state:"running", by:S.me, at:Date.now(), source:"ai"});
    const raw = await API.sample.json(reviewPrompt(post), {modelTier:"default"});
    const result = sanitizeReview(raw);
    await ref.set({state:"done", by:S.me, at:Date.now(), source:"ai", result, itineraryVersion:currentVersion()._id});
    toast("AI review saved for everyone");
    return true;
  }catch(e){
    try{ await ref.set({state:"failed", by:S.me, at:Date.now(), source:"ai", error:(e&&e.code)||"error"}); }catch(_){}
    toast(e && e.code ? sampleMsg(e) : dbErr(e)); return false;
  }finally{ const r=Object.assign({},S.running); delete r[post.id]; set({running:r}); }
}
async function decide(post, status, note, apply){
  const rv=S.reviews[post.id]; let ver=null;
  if(apply && rv && rv.result){
    const cur=currentVersion(); const res=rv.result;
    const days=applyChanges(cur.days, res.proposal ? res.proposal.changes : []);
    const adjust=Object.assign({}, cur.adjust||{}); BUDGET_CATS.forEach(c=>adjust[c.id]=(adjust[c.id]||0)+(res.costDelta[c.id]||0));
    const notes=(cur.adjustNotes||[]).concat([{post:post.id, title:post.title, delta:res.costDelta}]);
    ver = await createVersion(days, (res.proposal&&res.proposal.title||post.title)+" (suggested by "+nameOf(post.by)+")", {adjust, adjustNotes:notes, fromPost:post.id});
    if(!ver) return;
    status="incorporated";
  }
  if(await ownerWrite("decisions/post-"+post.id, {status, by:S.me, at:Date.now(), note:note||"", version:ver||null})) toast(status==="incorporated"?"Itinerary "+ver+" created":"Decision saved");
}

function Sheet({title, onClose, children, nodrag}){

function VersionsSheet({onPick}){
  const s=useStore(); const vs=versions(); const cur=currentVersion(); const [cmp,setCmp]=useState(null);
  return html`<${Sheet} title="Itinerary history" onClose=${closeSheet}>
    ${vs.length===0?html`<div class="small muted">No saved versions yet. The research baseline is shown until Bhargava saves it as v1.</div>`:null}
    ${s.itin.draft?html`<div class="card stack" style="gap:8px"><div class="row between"><b>Working draft</b><span class="row" style="gap:6px">${cur._id==="draft"?html`<span class="pill info">Current</span>`:null}<span class="pill warn">Not stored yet</span></span></div><div class="small">${s.itin.draft.why}</div><div class="tiny faint">Based on ${s.itin.draft.basedOn||"the stable version"} · ${ago(s.itin.draft.at)}. Becomes a version when you store it.</div><div class="row wrapr"><button class="btn sm" onClick=${()=>{ onPick&&onPick(cur._id==="draft"?null:"draft"); closeSheet(); }}>View</button></div></div>`:null}
    ${vs.map(v=>{ const prev=vs.find(x=>x.n===v.n-1); const df=prev?diffVersions(prev,v):null; const pr=projection(v);
      return html`<div class="card stack" style="gap:8px" key=${v._id}><div class="row between"><b>Version ${v.n}</b><span class="row" style="gap:6px">${v._id===cur._id?html`<span class="pill info">Current</span>`:null}${v.status==="approved"?html`<span class="pill ok">Stable</span>`:html`<span class="pill warn">Draft</span>`}</span></div>
        <div class="small">${v.why}</div><div class="tiny faint">${nameOf(v.by)} · ${ago(v.at)}</div>
        ${df&&cmp===v._id?html`<div class="small stack" style="gap:4px">${df.added.map(x=>html`<div style="color:var(--ok)">+ Day ${x.day}: ${x.text}</div>`)}${df.removed.map(x=>html`<div style="color:var(--bad)">− Day ${x.day}: ${x.text}</div>`)}${df.changed.map(([a,b])=>html`<div>~ Day ${b.day}: <s class="faint">${a.text}</s> → ${b.text}</div>`)}<div class="num">Cost: ${signed(projection(v).total-projection(prev).total)}</div>${!df.added.length&&!df.removed.length&&!df.changed.length?html`<div class="faint">No item changes.</div>`:null}</div>`:null}
        <div class="row wrapr">${df?html`<button class="btn sm" onClick=${()=>setCmp(cmp===v._id?null:v._id)}>${cmp===v._id?"Hide changes":"What changed"}</button>`:null}<button class="btn sm" onClick=${()=>{ onPick&&onPick(v._id===cur._id?null:v._id); closeSheet(); }}>View</button>${s.isOwner&&v._id!==cur._id?html`<button class="btn sm" onClick=${async()=>{ const id=await createVersion(v.days,"Restored version "+v.n,{plan:v.plan,adjust:clone(v.adjust)||{},adjustNotes:clone(v.adjustNotes)||[]}); if(id){ toast("Restored as "+id); closeSheet(); } }}>Restore</button>`:null}</div></div>`; })}
  <//>`;
}
function diffVersions(a,b){ const A=flatItems(a.days), B=flatItems(b.days); return {added:Object.keys(B).filter(k=>!A[k]).map(k=>B[k]), removed:Object.keys(A).filter(k=>!B[k]).map(k=>A[k]), changed:Object.keys(B).filter(k=>A[k]&&A[k].text!==B[k].text).map(k=>[A[k],B[k]])}; }

function ReviewView({p, rv}){

  return html`<div class="ai-box">
    <div class="row between"><h4>${rv.source==="manual"?"Manual review":rv.source==="claude"?"Claude research":"AI review"}</h4><span class=${"pill "+(r.verdict==="not_recommended"?"bad":r.verdict==="needs_info"?"warn":"ok")}>${verdictL}</span></div>

    ${dsum!==0?html`<div class="costline num">${BUDGET_CATS.filter(c=>r.costDelta[c.id]).map(c=>html`<span key=${c.id}><span class="dot" style=${{background:c.color}}></span> ${c.label} ${signed(r.costDelta[c.id])}</span>`)}</div>`:null}
    ${r.proposal?html`<div class="stack" style="gap:6px"><div class="eyebrow">Proposed change: ${r.proposal.title}</div>
      <div class="cmp"><div><div class="tiny faint">Now</div>${r.proposal.current}</div><div><div class="tiny faint">Proposed</div>${r.proposal.proposed}</div></div>
      ${r.proposal.changes.length?html`<div class="small stack" style="gap:3px">${r.proposal.changes.map((c,i)=>html`<div key=${i}>${c.op==="add"?html`<span style="color:var(--ok)">+ Day ${c.day} ${c.slot}: ${c.time} ${c.text}</span>`:c.op==="remove"?html`<span style="color:var(--bad)">− Day ${c.day}: ${items[c.itemId]?items[c.itemId].text:c.itemId}</span>`:html`<span>~ Day ${c.day}: <s class="faint">${items[c.itemId]?items[c.itemId].text:""}</s> → ${c.text}</span>`}</div>`)}</div>`:null}
      <div class="eyebrow" style="margin-top:4px">Group approval</div><${VoteBar} target=${"prop-"+p.id}/></div>`:null}
    ${r.reasoning&&r.reasoning!==r.summary?html`<div><div class="eyebrow">Reasoning</div><div class="small">${r.reasoning}</div></div>`:null}
    ${r.facts&&r.facts.length?html`<div><div class="eyebrow">What it's based on</div><ul class="clean small">${r.facts.map((f,i)=>html`<li key=${i}>${f.text} ${factTag(f.basis)}</li>`)}</ul></div>`:null}
    ${(r.pros&&r.pros.length)||(r.cons&&r.cons.length)?html`<div class="cmp"><div><div class="eyebrow" style="color:var(--ok)">For</div><ul class="clean small">${r.pros.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul></div><div><div class="eyebrow" style="color:var(--bad)">Against</div><ul class="clean small">${r.cons.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul></div></div>`:null}

function feed(){

    if(p.joinedAt) ev.push({at:p.joinedAt, who:id, text:"joined the trip"});
    (p.posts||[]).forEach(x=>{ if(x.kind==="suggestion") ev.push({at:x.at, who:id, text:"suggested “"+clip(x.title,60)+"”", open:["post",{id:x.id}]}); else if(x.kind==="comment") ev.push({at:x.at, who:id, text:(x.parent?"replied on ":"commented on ")+labelFor(x.target), quote:clip(x.body,90)}); });

    Object.entries(p.votes||{}).forEach(([k,v])=>{ if(k.startsWith("prop-")) ev.push({at:v.at, who:id, text:(v.v===1?"supported ":"opposed ")+labelFor(k)}); });
  });
  Object.entries(S.reviews).forEach(([k,r])=>{ if(r.state!=="done") return; const p=allPosts().find(x=>x.id===k); if(!p) return; ev.push({at:r.at, who:r.source==="manual"?r.by:"ai", text:(r.source==="manual"?"reviewed “":"reviewed “")+clip(p.title,50)+"”: "+(r.result&&r.result.summary?clip(r.result.summary,90):""), open:["post",{id:k}]}); });
  Object.entries(S.decisions).forEach(([k,d])=>{ if(k.startsWith("post-")){ const p=allPosts().find(x=>x.id===k.slice(5)); ev.push({at:d.at, who:d.by, text:(d.status==="rejected"?"rejected “":d.status==="incorporated"?"added to the itinerary “":"approved “")+(p?clip(p.title,50):"a suggestion")+"”", open:p?["post",{id:p.id}]:null}); } else if(k.startsWith("poll-")){ const poll=POLLS.find(q=>"poll-"+q.id===k); const o=poll&&poll.opts.find(z=>z.id===d.choice); ev.push({at:d.at, who:d.by, text:"locked the decision: "+(o?o.label:d.choice)}); } });

  return ev.filter(e=>e.at).sort((a,b)=>b.at-a.at).slice(0,120);
}

function Donut({parts, size}){
  const total=parts.reduce((a,p)=>a+p.v,0)||1; let acc=0; const r=52, c=2*Math.PI*r;

    ${parts.filter(p=>p.v>0).map(p=>{ const len=p.v/total*c; const el=html`<circle key=${p.label} cx="66" cy="66" r=${r} fill="none" stroke=${p.color} stroke-width="18" stroke-dasharray=${len+" "+(c-len)} stroke-dashoffset=${-acc} transform="rotate(-90 66 66)"/>`; acc+=len; return el; })}
    <text x="66" y="62" text-anchor="middle" font-size="11" fill="var(--ink-3)">group</text><text x="66" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">${"₹"+Math.round(total/1000)+"k"}</text></svg>`;
}

   ==================================================================== */
function AskSheet(){
  const s=useStore(); const [q,setQ]=useState(""); const [a,setA]=useState(""); const [busy,setBusy]=useState(false); const ctl=useRef(null);
  const ask=async e=>{ e&&e.preventDefault(); if(!q.trim()||!API.sample) return; setBusy(true); setA("Thinking…"); ctl.current=new AbortController();
    try{ await API.sample(`You are the AI trip planner for "Kerala Trip HQ" (4 friends, Kerala, 22–29 Dec 2026, self-drive car). Answer the traveller's question in under 180 words, specific to this trip and its current itinerary. You cannot browse: say when something is from general knowledge and must be verified. Plain text, short paragraphs or "- " bullets.\n\nTRIP DATA: ${JSON.stringify(tripContext())}\n\nQUESTION from ${nameOf(s.me)}: ${q.trim()}`, {signal:ctl.current.signal, onText:({text})=>setA(text)}); }
    catch(err){ setA(err.text||""); if(err.code!=="cancelled") toast(sampleMsg(err)); }
    setBusy(false); };
  const share=async()=>{ if(!a||!canContribute()) return; const ok=await addPost({kind:"suggestion", cat:"other", title:clip("Q: "+q.trim(),120), body:clip("AI planner answer:\n"+a,1500), cost:0, target:null}); if(ok!==false){ toast("Shared to the Crew board"); closeSheet(); } };
  return html`<${Sheet} title="Ask the AI planner" onClose=${closeSheet}>
    ${!s.sampleOK?html`<div class="banner warn small">AI is only available when this trip is opened inside Claude and signed in.</div>`:html`<form class="stack" onSubmit=${ask}>
      <div class="chips">${["Is Kolukkumalai worth the 04:45 start?","What should we pack for Munnar in December?","Cheapest way to cut the car cost?"].map(t=>html`<button type="button" class="chip" key=${t} onClick=${()=>setQ(t)}>${t}</button>`)}</div>
      <textarea id="ask-q" class="field" placeholder="Ask anything about the trip" value=${q} onInput=${e=>setQ(e.target.value)}></textarea>
      <div class="row"><button class="btn ai grow" type="submit" disabled=${busy||!q.trim()}>${busy?html`<span class="spinner"></span> Asking…`:"Ask"}</button>${busy?html`<button type="button" class="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Stop</button>`:null}</div></form>`}
    ${a?html`<div class="ai-box"><h4>Answer</h4><div class="small" style="white-space:pre-wrap">${a}</div><div class="tiny faint">Not live-verified. Answers aren't saved unless you share them.</div>${!busy&&canContribute()?html`<button class="btn sm" onClick=${share}>Share to the Crew board</button>`:null}</div>`:null}
  <//>`;
}

/* ====================================================================
   13. SHELL
   ==================================================================== */
const TABS=[["home","Home","home"],["explore","Explore","explore"],["itinerary","Itinerary","itin"],["crew","Crew","crew"],["budget","Budget","budget"]];
const tabFromHash=()=>{ const t=(location.hash||"").slice(1); return TABS.some(x=>x[0]===t)?t:"home"; };
function SheetHost(){
  const s=useStore(); const sh=s.sheet;
  const needJoin = s.mode==="live" && s.loaded.people && !s.people[s.me] && s.canWrite!==false;
  if(needJoin && (!sh || sh.type!=="join")) return html`<${JoinSheet}/>`;
  if(!sh) return null; const p=sh.props;
  switch(sh.type){
    case "dest": return html`<${DestSheet} ...${p}/>`; case "item": return html`<${ItemSheet} ...${p}/>`; case "versions": return html`<${VersionsSheet} ...${p}/>`;
    case "newpost": return canContribute()?html`<${NewPostSheet} ...${p}/>`:null; case "post": return html`<${PostSheet} ...${p}/>`;
    case "expense": return canContribute()?html`<${ExpenseSheet}/>`:null; case "booking": return html`<${BookingSheet} ...${p}/>`;
    case "join": return html`<${JoinSheet} ...${p}/>`; case "ask": return s.isOwner?html`<${AskSheet}/>`:null;
  } return null;
}
const autoTried=new Set(); let autoBusy=false;
function App(){
  const s=useStore(); const [tab,setTab]=useState(tabFromHash());
  useEffect(()=>{ const f=()=>setTab(tabFromHash()); addEventListener("hashchange",f); return ()=>removeEventListener("hashchange",f); },[]);
  const go=t=>{ try{ history.replaceState(null,"","#"+t); }catch(e){ location.hash=t; } setTab(t); window.scrollTo(0,0); };
  const wIds=s.isOwner&&s.sampleOK&&s.mode==="live"&&canContribute()?awaitingReview().map(p=>p.id).join(","):"";
  useEffect(()=>{ if(!wIds||autoBusy) return; (async()=>{ autoBusy=true; for(const id of wIds.split(",")){ if(autoTried.has(id)) continue; autoTried.add(id); const post=allPosts().find(x=>x.id===id); if(post&&statusOf(post)==="new"){ const ok=await runReview(post); if(!ok) break; } } autoBusy=false; })(); },[wIds]);
  const badge=awaitingReview().length+pendingDecisions().filter(x=>x.kind==="post").length;
  return html`<div class="app">
    ${tab!=="home"?html`<${Banner}/>`:null}
    <main key=${tab} class="view">${tab==="home"?html`<${Home} go=${go}/>`:tab==="explore"?html`<${Explore}/>`:tab==="itinerary"?html`<${Itinerary}/>`:tab==="crew"?html`<${Crew}/>`:html`<${Budget}/>`}</main>
    
    <nav class="nav" aria-label="Main"><div class="nav-in">${TABS.map(([k,l,icn])=>html`<button key=${k} class=${"navbtn "+(tab===k?"on":"")} aria-current=${tab===k?"page":null} onClick=${()=>go(k)}><span class="ic">${ic(IC[icn])}</span>${l}${k==="crew"&&badge?html`<span class="badge">${badge}</span>`:null}</button>`)}</div></nav>
    <${SheetHost}/>
    <div class="toasts" aria-live="polite">${s.toasts.map(t=>html`<div class=${"toast"+(t.leaving?" leaving":"")} key=${t.id}>${t.msg}</div>`)}</div>
  </div>`;
}
render(html`<${App}/>`, document.getElementById("app"));
boot().catch(()=>set({mode:"offline"}));
})();
</script>
